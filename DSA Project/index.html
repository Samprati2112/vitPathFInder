<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Language | VIT PathFinder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">

  <div class="text-center">
    <h1 class="text-3xl font-bold mb-6">🌐 Select Your Language</h1>
    
    <div class="flex flex-col gap-4 w-64 mx-auto">
      <button onclick="selectLanguage('en')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">English</button>
      <button onclick="selectLanguage('hn')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">हिन्दी (Hindi)</button>
      <button onclick="selectLanguage('tm')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">தமிழ் (tamil)</button>
      <button onclick="selectLanguage('kn')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">ಕನ್ನಡ (kannada)</button>
      <button onclick="selectLanguage('pj')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">ਪੰਜਾਬੀ (Punjabi)</button>
      <button onclick="selectLanguage('mh')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">मराठी (Marathi)</button>
      <button onclick="selectLanguage('ml')" class="bg-indigo-600 hover:bg-indigo-700 py-3 rounded-lg font-medium">മലയാളം (Malayam)</button>
    </div>
  </div>

  <script>
    function selectLanguage(lang) {
      localStorage.setItem("selectedLang", lang);
      window.location.href = "pathFinder.html";
    }
  </script>

</body>
</html>
